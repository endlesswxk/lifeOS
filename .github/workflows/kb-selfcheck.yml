name: kb-selfcheck

on:
  push:
    paths: ["kb/**"]
  pull_request:
    paths: ["kb/**"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 取上游原文（不随仓库分发）
        run: python 数据与脚本/fetch_sources.py
      - name: 重建派生物
        run: |
          python 数据与脚本/build_kb.py
          python 数据与脚本/build_site.py
          python 数据与脚本/build_refs.py
      - name: 一致性自检
        run: python 数据与脚本/自检.py
        env:
          PYTHONIOENCODING: utf-8
